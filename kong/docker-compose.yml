  services:
    kong-database:
      image: postgres:12
      container_name: kong-database
      environment:
        POSTGRES_USER: kong
        POSTGRES_DB: kong
        POSTGRES_PASSWORD: kong
      ports:
        - "5432:5432"
      volumes:
        - kong_data:/var/lib/postgresql/data   # 数据持久化,重启不丢
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "kong"]
        interval: 5s
        timeout: 5s
        retries: 10
      restart: on-failure

    kong-migrations:
      image: kong:3.4
      command: kong migrations bootstrap
      depends_on:
        kong-database:
          condition: service_healthy
      environment:
        KONG_DATABASE: postgres
        KONG_PG_HOST: kong-database    
        KONG_PG_USER: kong
        KONG_PG_PASSWORD: kong
      restart: on-failure

    kong:
      image: kong:3.4
      container_name: kong
      depends_on:
        kong-database:
          condition: service_healthy
        kong-migrations:
          condition: service_completed_successfully   
      environment:
        KONG_DATABASE: postgres
        KONG_PG_HOST: 192.168.1.106    # 用宿主机 IP 直连 DB(postgres 已映射 5432),避开被 Consul DNS 接管后解析不了容器名的问题
        KONG_PG_USER: kong
        KONG_PG_PASSWORD: kong
        KONG_PROXY_ACCESS_LOG: /dev/stdout
        KONG_ADMIN_ACCESS_LOG: /dev/stdout
        KONG_PROXY_ERROR_LOG: /dev/stderr
        KONG_ADMIN_ERROR_LOG: /dev/stderr
        KONG_ADMIN_LISTEN: 0.0.0.0:8001          # 开放 Admin API 给容器外
        KONG_ADMIN_GUI_URL: http://localhost:8002
        KONG_DNS_RESOLVER: 192.168.1.106:8600 # 指向宿主机上的 Consul DNS(8600),IP 换网络会变,变了改这里
      ports:
        - "8000:8000"   # 代理入口,客户端真正访问业务走这里
        - "8443:8443"   # 代理 HTTPS
        - "8001:8001"   # Admin API,你用 curl 配置走这里
        - "8002:8002"   # Kong Manager 网页后台
      restart: on-failure

  volumes:
    kong_data: